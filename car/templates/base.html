<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>{% block title %}CarZone{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
       
       * {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Comic Sans MS', 'Poppins', sans-serif;
    background: linear-gradient(135deg, #fceabb, #f8b500);
    color: #2d2d2d;
    line-height: 1.6;
    animation: fadeIn 1s ease;
}

a {
    text-decoration: none;
    color: #ff4081;
    font-weight: 600;
}

a:hover {
    text-decoration: underline;
    color: #e91e63;
}

/* Navbar */
.navbar {
    background: linear-gradient(90deg, #ff6f91, #ff9671);
    padding: 1rem 2rem;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px solid #ffcb05;
}

.navbar .logo {
    font-size: 1.8rem;
    font-weight: bold;
    color: #fff;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 1.2rem;
}

.nav-links li a {
    color: #fff;
    font-weight: bold;
    font-size: 1rem;
    transition: all 0.3s ease;
    padding: 6px 12px;
    border-radius: 6px;
}

.nav-links li a:hover {
    background-color: #fff;
    color: #ff4081;
}

/* Container */
.container {
    max-width: 1100px;
    margin: 2rem auto;
    padding: 0 1.2rem;
}

/* Footer */
footer {
    background-color: #ff6f91;
    color: #fff;
    text-align: center;
    padding: 1rem 0;
    margin-top: 3rem;
    font-size: 1rem;
    border-top: 4px solid #f9f871;
}

/* Button */
.btn {
    display: inline-block;
    padding: 0.6rem 1.4rem;
    background-color: #00bcd4;
    color: white;
    border-radius: 30px;
    font-weight: bold;
    font-size: 1rem;
    transition: 0.3s ease;
    border: none;
    cursor: pointer;
}

.btn:hover {
    background-color: #0097a7;
    transform: scale(1.05);
}

/* Form */
form {
    background: #fff9c4;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    max-width: 500px;
    margin: 2rem auto;
    animation: fadeInUp 0.8s ease;
}

label {
    display: block;
    margin-top: 1rem;
    font-weight: bold;
    color: #ff4081;
}

input[type="text"],
input[type="number"],
select,
textarea {
    width: 100%;
    padding: 0.6rem;
    margin-top: 0.3rem;
    border: 2px solid #ffb347;
    border-radius: 10px;
    font-size: 1rem;
    transition: border-color 0.3s ease;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #ff4081;
    outline: none;
}

.form-error {
    color: #e53935;
    margin-top: 0.3rem;
    font-size: 0.85rem;
}

/* Messages */
.messages {
    max-width: 600px;
    margin: 1rem auto;
    text-align: center;
}

.messages .success {
    background-color: #81c784;
    color: white;
    padding: 0.8rem 1.2rem;
    border-radius: 10px;
    margin-bottom: 1rem;
    font-weight: bold;
}

.messages .error {
    background-color: #e57373;
    color: white;
    padding: 0.8rem 1.2rem;
    border-radius: 10px;
    margin-bottom: 1rem;
    font-weight: bold;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

    </style>
</head>
<body>

<header class="navbar">
    <div class="logo"> 🚗 CarZone</div>
    <ul class="nav-links">
        <li><a href="{% url 'car_list' %}">Home</a></li>
        <li><a href="{% url 'car_create' %}">Add Car</a></li>
    </ul>
</header>

<div class="container">
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div class="{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}
</div>

<footer>
    &copy; 2025 CarZone. All rights reserved.
</footer>

</body>
</html>
